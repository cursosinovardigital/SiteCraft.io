<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiteCraft Studio v3.5 — Enriquecimento Ativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --bg: #f4f4f6; --bg-elev: #ffffff; --bg-card: #ffffff; --bg-glass: rgba(255, 255, 255, 0.85); --tx: #0f1117; --mu: #64687a; --bd: #e2e4ec; --bd-hover: #c5c9d6; --ac: #ef4d23; --ac-glow: rgba(239, 77, 35, 0.22); --ac2: #10b981; --sh: 0 10px 30px -10px rgba(0,0,0,0.07); }
[data-theme="dark"] { --bg: #07080c; --bg-elev: #0e1017; --bg-card: #12151e; --bg-glass: rgba(18, 21, 30, 0.82); --tx: #f3f4f8; --mu: #8e93a6; --bd: #222634; --bd-hover: #363c52; --ac: #ef4d23; --ac-glow: rgba(239, 77, 35, 0.28); --ac2: #10b981; --sh: 0 16px 40px -12px rgba(0,0,0,0.55); }
- { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--tx); min-height: 100vh; overflow-x: hidden; }
header { position: sticky; top: 0; z-index: 50; background: var(--bg-glass); backdrop-filter: blur(16px); border-bottom: 1px solid var(--bd); display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; flex-wrap: wrap; }
.brand-wrap { display: flex; align-items: center; gap: 10px; }
.brand-icon { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--ac), #f0a24c); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 16px; }
.logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px; }
.logo i { color: var(--ac); font-style: normal; }
.badge-pro { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.35); }
nav { display: flex; gap: 5px; background: var(--bg-elev); padding: 5px; border-radius: 12px; border: 1px solid var(--bd); }
nav button { border: none; background: transparent; color: var(--mu); padding: 8px 14px; border-radius: 8px; font: 600 12.5px 'Inter', sans-serif; cursor: pointer; }
nav button.on { background: var(--bg-card); color: var(--tx); border: 1px solid var(--bd); }
.btn { background: linear-gradient(135deg, var(--ac), #d93d14); color: #fff; border: 1px solid rgba(255,255,255,0.15); padding: 9px 15px; border-radius: 10px; font: 600 12.5px 'Inter', sans-serif; cursor: pointer; }
.btn2 { background: var(--bg-card); color: var(--tx); border: 1px solid var(--bd); padding: 8px 13px; border-radius: 10px; font: 500 12.5px 'Inter', sans-serif; cursor: pointer; }
.btn2.active-toggle { border-color: #10b981; color: #10b981; font-weight: 700; background: rgba(16,185,129,0.1); }
main { max-width: 1420px; margin: 0 auto; padding: 28px 24px 80px; }
.sec-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; }
h1 { font-family: 'Syne', sans-serif; font-size: clamp(22px, 2.8vw, 30px); letter-spacing: -0.03em; }
.sub { color: var(--mu); font-size: 13.5px; margin-top: 6px; }
.bl { display: grid; grid-template-columns: 370px 1fr; gap: 20px; align-items: start; }
.pan { background: var(--bg-card); border: 1px solid var(--bd); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; max-height: 840px; overflow-y: auto; }
.pan-group { border-top: 1px solid var(--bd); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.pan-title { font-size: 11px; font-weight: 800; color: var(--ac); }
label { font-size: 11px; font-weight: 700; color: var(--mu); margin-bottom: 4px; display: block; }
input, textarea, select { width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--bd); background: var(--bg-elev); color: var(--tx); font: 13px 'Inter', sans-serif; outline: none; }
input[type="color"] { height: 36px; padding: 2px; }
.stage { background: var(--bg-card); border: 1px solid var(--bd); border-radius: 18px; display: flex; flex-direction: column; height: 840px; overflow: hidden; }
.bar { display: flex; gap: 7px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--bd); background: var(--bg-elev); }
.fr { flex: 1; display: flex; justify-content: center; background: #050608; overflow: hidden; position: relative; }
.fr iframe { border: 0; background: #fff; height: 100%; width: 100%; transition: width 0.3s; }
.hid { display: none !important; }
#toast { position: fixed; bottom: 24px; right: 24px; z-index: 100; background: var(--tx); color: var(--bg); padding: 12px 18px; border-radius: 12px; font: 600 13px 'Inter', sans-serif; opacity: 0; transform: translateY(10px); transition: 0.25s; }
#toast.on { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<header>
  <div class="brand-wrap">
    <div class="brand-icon">S</div><div class="logo">Site<i>Craft</i></div><span class="badge-pro">⚡ Dados Enriquecidos</span>
  </div>
  <nav><button data-t="montador" class="on">✏️ Montador Visual Enriquecido</button></nav>
  <div><button class="btn2" id="theme">☀️ Tema claro</button></div>
</header>

<main>
  <section id="s-montador">
    <div class="sec-head">
      <div>
        <h1>Editor com Enriquecimento Ativo do Google</h1>
        <p class="sub">Se o Prospecta enviou os dados do Google (Fotos Reais e Avaliações), os cards de prova social abaixo já estarão preenchidos automaticamente.</p>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn2" id="btn-inline-edit" style="border-color:#10b981;color:#10b981">✏️ Edição Direta: ATIVA</button>
        <button class="btn" id="b-dl-top">⬇ Baixar HTML Final</button>
      </div>
    </div>

    <div class="bl">
      <div class="pan">
        <div><label>Template Mestre</label><select id="b-model"></select></div>

        <div class="pan-group">
          <div class="pan-title">📝 Textos Principais</div>
          <div><label>Nome da Marca</label><input id="b-brand"></div>
          <div><label>Selo / Destaque</label><input id="b-kicker"></div>
          <div><label>Título (Use / para quebra)</label><input id="b-head"></div>
          <div><label>Subtítulo</label><textarea id="b-sub" rows="3"></textarea></div>
        </div>

        <div class="pan-group">
          <div class="pan-title">⭐ Prova Social & Enriquecimento Google</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <div><label>Nota (Estrelas)</label><input id="b-rating" type="number" step="0.1" max="5"></div>
            <div><label>Total Avaliações</label><input id="b-reviews" type="number"></div>
          </div>
          <div><label>URL Foto Real / Fundo (Google Images)</label><input id="b-media"></div>
        </div>

        <div class="pan-group">
          <div class="pan-title">🎨 Cor & Ação</div>
          <div style="display:grid;grid-template-columns:1fr 60px;gap:8px">
            <div><label>Texto do Botão</label><input id="b-cta"></div>
            <div><label>Cor</label><input id="b-color" type="color"></div>
          </div>
          <div><label>Link (WhatsApp)</label><input id="b-link"></div>
        </div>
      </div>

      <div class="stage">
        <div class="bar">
          <button class="btn2" data-d="100%">🖥️ Desktop</button>
          <button class="btn2" data-d="820px">📱 Tablet</button>
          <button class="btn2" data-d="390px">📱 Celular</button>
          <span style="flex:1"></span>
          <button class="btn" id="b-cp" style="padding:7px 12px;font-size:11px">📋 Copiar HTML</button>
        </div>
        <div class="fr"><iframe id="b-frame"></iframe></div>
      </div>
    </div>
  </section>
</main>

<div id="toast"></div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const splitLines = (s, f1, f2, f3) => { const p = String(s || '').split('/').map(x => x.trim()).filter(Boolean); return [p[0] || f1, p[1] || f2 || '', p[2] || f3 || '']; };

/* =========================================================================
   TEMPLATES MESTRES (ADAPTADOS PARA EXIBIR AVALIAÇÕES REAIS DO GOOGLE)
   ========================================================================= */
const MODELS = {
  nuvo: {
    n: 'nuvo — Clínicas & Serviços (Fundo Foto Real)',
    defaults: { brand: 'nuvo', kicker: 'Atendimento humanizado', head: 'A gestão que / acompanha o / seu ritmo', sub: 'Estrutura completa.', cta: 'Agendar avaliação', link: '#', color: '#FA7F62', media: '', rating: '5.0', reviews: '120' },
    f: d => {
      const [l1, l2, l3] = splitLines(d.head, 'A gestão', 'que acompanha', 'seu ritmo');
      const bgImg = d.media || 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1400&q=80';
      return `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(d.brand)}</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
body { background: #F8E6DD; color: #151615; font-family: 'Instrument Sans', sans-serif; min-height: 100vh; padding: 10px; display: flex; margin:0; }
.shell { background: #FAF9F5; border-radius: 26px; width: 100%; min-height: calc(100vh - 20px); display: grid; grid-template-columns: 46% 54%; overflow: hidden; padding: 10px; }
.left-panel { position: relative; border-radius: 20px; overflow: hidden; background: url('${esc(bgImg)}') center/cover no-repeat; padding: 28px; display: flex; flex-direction: column; justify-content: space-between; min-height: 560px; }
.left-panel::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(25,35,45,0.2) 0%, rgba(20,25,20,0.65) 100%); }
.card-stack { position: relative; z-index: 2; margin: auto; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
.c-glass { background: rgba(255,255,255,0.85); backdrop-filter: blur(14px); border-radius: 18px; padding: 16px 20px; box-shadow: 0 14px 32px rgba(0,0,0,0.18); text-align: center; }
.c-glass .stars { color: #f59e0b; font-size: 22px; letter-spacing: 2px; }
.c-glass .rev { font-size: 12px; font-weight: 700; color: #333; margin-top: 6px; }
.c-dark { background: #2C3426; color: #fff; border-radius: 18px; padding: 18px 20px; box-shadow: 0 18px 40px rgba(0,0,0,0.3); }
.c-dark .logo-serif { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 34px; line-height: 1; margin-top: 10px;}
.right-col { display: flex; flex-direction: column; justify-content: space-between; padding: 28px 44px; text-align: center; }
h1 { font-size: clamp(38px, 4.8vw, 62px); line-height: 1.04; letter-spacing: -0.03em; margin-bottom: 20px; }
h1 em { font-family: 'Instrument Serif', serif; font-weight: 400; color: ${d.color}; }
.lede { color: #696C64; font-size: 16px; margin: 0 auto 28px; max-width: 390px; }
.cta-pill { display: inline-flex; align-items: center; gap: 14px; background: ${d.color}; color: #151615; text-decoration: none; font-weight: 700; padding: 12px 12px 12px 24px; border-radius: 999px; }
.cta-pill .arr { width: 36px; height: 36px; border-radius: 999px; background: #151615; color: #fff; display: grid; place-items: center; }
@media (max-width: 860px) { .shell { grid-template-columns: 1fr; } .right-col { order: -1; padding: 24px 20px; } }
</style>
</head>
<body>
  <div class="shell">
    <div class="left-panel">
      <div class="card-stack">
        <div class="c-glass">
          <div class="stars">★★★★★</div>
          <div class="rev">${esc(d.rating)} de ${esc(d.reviews)} avaliações no Google</div>
        </div>
        <div class="c-dark">
          <div style="font-size:11px;opacity:.7">Verificado em ${esc(d.kicker.split('·')[1] || 'Guarulhos')}</div>
          <div class="logo-serif">${esc(d.brand)}</div>
        </div>
      </div>
    </div>
    <div class="right-col">
      <div></div>
      <div>
        <h1>${esc(l1)}<br>${esc(l2)}<br><em>${esc(l3)}</em></h1>
        <p class="lede">${esc(d.sub)}</p>
        <a href="${esc(d.link)}" class="cta-pill"><span>${esc(d.cta)}</span><span class="arr">↗</span></a>
      </div>
      <div style="font-size:13px;color:#8c8d88;font-weight:600">${esc(d.kicker)}</div>
    </div>
  </div>
</body>
</html>`;
    }
  },
  convix: {
    n: 'Convix — Plataforma & B2B',
    defaults: { brand: 'Convix', kicker: 'Alta Performance', head: 'Acelerando Resultados', sub: 'O ecossistema completo.', cta: 'Falar Especialista', link: '#', color: '#ef4d23', media: '', rating: '5.0', reviews: '100' },
    f: d => {
      const vidUrl = d.media || 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260424_064411_9e9d7f84-9277-41f4-ab10-59172d89e6be.mp4';
      return `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(d.brand)}</title><script src="https://cdn.tailwindcss.com"><\/script>
</head>
<body class="bg-[#ededed] p-3"><div class="relative w-full min-h-[96vh] bg-black rounded-3xl overflow-hidden flex flex-col items-center justify-center text-white text-center">
  <video class="absolute inset-0 w-full h-full object-cover opacity-60" autoplay loop muted src="${esc(vidUrl)}"></video>
  <div class="relative z-10 p-6">
    <div class="inline-flex gap-2 bg-white/10 rounded-full px-4 py-1.5 text-sm backdrop-blur-md mb-6 border border-white/20">★ ${esc(d.rating)} - Recomendado por ${esc(d.reviews)} clientes</div>
    <h1 class="text-5xl md:text-7xl font-bold mb-4">${esc(d.head)}</h1>
    <p class="max-w-xl mx-auto text-lg text-gray-300 mb-8">${esc(d.sub)}</p>
    <a href="${esc(d.link)}" class="bg-[${d.color}] text-white px-8 py-4 rounded-full font-bold text-lg inline-block hover:scale-105 transition">${esc(d.cta)}</a>
  </div>
</div></body></html>`;
    }
  }
};

const $ = s => document.querySelector(s);
let currentModelKey = 'nuvo';
let inlineEditEnabled = true;
const D = { ...MODELS.nuvo.defaults };

const toast = msg => { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2500); };

function enableIframeInlineEditing() {
  const frame = $('#b-frame'); if (!frame || !frame.contentDocument) return;
  const doc = frame.contentDocument;
  let style = doc.getElementById('inline-helper');
  if (!style) {
    style = doc.createElement('style'); style.id = 'inline-helper';
    style.textContent = `[contenteditable="true"]{outline:none;cursor:text;}[contenteditable="true"]:focus{box-shadow:0 0 0 2px #10b981;background:rgba(16,185,129,.1);}`;
    doc.head.appendChild(style);
  }
  doc.querySelectorAll('h1, p, div.rev, div.logo-serif, span, a').forEach(el => {
    if (inlineEditEnabled) { el.setAttribute('contenteditable', 'true'); if (el.tagName === 'A') el.onclick = ev => ev.preventDefault(); }
    else el.removeAttribute('contenteditable');
  });
}

function renderBuilder() {
  const frame = $('#b-frame'); frame.onload = enableIframeInlineEditing;
  frame.srcdoc = MODELS[currentModelKey].f(D);
}

function fillBuilderForm() {
  $('#b-model').value = currentModelKey; $('#b-brand').value = D.brand; $('#b-kicker').value = D.kicker;
  $('#b-head').value = D.head; $('#b-sub').value = D.sub; $('#b-cta').value = D.cta; $('#b-link').value = D.link;
  $('#b-color').value = D.color; $('#b-media').value = D.media; $('#b-rating').value = D.rating; $('#b-reviews').value = D.reviews;
}

/* LEITURA DE PARÂMETROS DO PROSPECTA (COM ENRIQUECIMENTO) */
function checkURLParams() {
  const p = new URLSearchParams(window.location.search);
  const emp = p.get('empresa');
  if (emp) {
    currentModelKey = p.get('tpl') || 'nuvo';
    D.brand = emp;
    D.kicker = `Atendimento Exclusivo · ${p.get('cidade') || ''}`;
    D.head = p.get('head') || MODELS[currentModelKey].defaults.head;
    D.sub = MODELS[currentModelKey].defaults.sub;
    D.cta = 'Agendar Atendimento';
    D.link = `https://wa.me/${(p.get('whats') || '').replace(/\D/g,'')}`;
    D.color = MODELS[currentModelKey].defaults.color;
    D.rating = p.get('rating') || '5.0';
    D.reviews = p.get('reviews') || '120';
    D.media = p.get('img') || '';
    fillBuilderForm(); renderBuilder();
    toast('🎯 Dados e Fotos Reais do Prospecta.io Carregados!');
  } else {
    fillBuilderForm(); renderBuilder();
  }
}

$('#b-model').innerHTML = Object.keys(MODELS).map(k => `<option value="${k}">${esc(MODELS[k].n)}</option>`).join('');
$('#b-model').onchange = e => { currentModelKey = e.target.value; Object.assign(D, MODELS[currentModelKey].defaults); fillBuilderForm(); renderBuilder(); };

['brand','kicker','head','sub','cta','link','color','media','rating','reviews'].forEach(k => {
  $('#b-' + k).oninput = e => { D[k] = e.target.value; renderBuilder(); };
});

$('#btn-inline-edit').onclick = () => {
  inlineEditEnabled = !inlineEditEnabled; $('#btn-inline-edit').textContent = inlineEditEnabled ? '✏️ Edição Direta: ATIVA' : '✏️ Edição Direta: PAUSADA';
  enableIframeInlineEditing();
};

const getHTML = () => {
  const doc = $('#b-frame').contentDocument.documentElement.cloneNode(true);
  doc.querySelectorAll('[contenteditable]').forEach(e => e.removeAttribute('contenteditable'));
  if (doc.querySelector('#inline-helper')) doc.querySelector('#inline-helper').remove();
  return '<!DOCTYPE html>\n' + doc.outerHTML;
};
$('#b-cp').onclick = () => { navigator.clipboard.writeText(getHTML()); toast('Copiado!'); };
$('#b-dl-top').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([getHTML()], {type:'text/html'})); a.download = D.brand.replace(/\s+/g,'-') + '.html'; a.click(); toast('Baixado!'); };

document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => $('#b-frame').style.width = b.dataset.d);
$('#theme').onclick = () => { const isDark = document.documentElement.dataset.theme === 'dark'; document.documentElement.dataset.theme = isDark ? 'light' : 'dark'; $('#theme').textContent = isDark ? '🌙 Tema escuro' : '☀️ Tema claro'; };

checkURLParams();
</script>
</body>
</html>
